name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S test/host -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/host -j
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn: [arduino:renesas_uno:minima, arduino:renesas_uno:unor4wifi]
        # DIAG = diagnostics only (the default); FIELD = production. The DFRobot library is not in the
        # Library Manager, so CI builds without it (-DN2_NO_DFROBOT: the O2 sensor then reads as absent).
        mode: [N2_BUILD_DIAG, N2_BUILD_FIELD]
    steps:
      # The sketch lives in the repo's N2V8/ folder (folder name = .ino name, as the Arduino IDE requires).
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the UNO R4 core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
      - name: Compile (prints flash and RAM use)
        run: >
          arduino-cli compile --fqbn ${{ matrix.fqbn }} --warnings more
          --build-property "compiler.cpp.extra_flags=-D${{ matrix.mode }} -DN2_NO_DFROBOT"
          N2V8
